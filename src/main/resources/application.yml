spring:
  application:
    name: siteflow
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:siteflow}?sslMode=${DB_SSL_MODE:VERIFY_IDENTITY}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}&serverTimezone=UTC${DB_JDBC_PARAMS:}
    username: ${DB_USERNAME:siteflow_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
  flyway:
    enabled: true
    user: ${FLYWAY_DB_USERNAME:${DB_USERNAME:siteflow_migration}}
    password: ${FLYWAY_DB_PASSWORD:${DB_PASSWORD}}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
  mvc:
    throw-exception-if-no-handler-found: true
    async:
      request-timeout: ${SPRING_MVC_ASYNC_REQUEST_TIMEOUT:30000ms}
  web:
    resources:
      # This backend serves no static resources (the Vue SPA is built/served
      # separately), so disabling the resource-handler fallback lets an unmapped
      # API path reach GlobalExceptionHandler's NoHandlerFoundException handler
      # instead of falling through to a generic 404.
      add-mappings: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:20000ms}
    max-swallow-size: 2MB
    max-http-form-post-size: 2MB

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

security:
  login:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    lockout-duration-ms: ${LOGIN_LOCKOUT_DURATION_MS:900000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    trust-proxy: ${RATE_LIMIT_TRUST_PROXY:false}
    login:
      requests: ${RATE_LIMIT_LOGIN_REQUESTS:5}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
    api:
      requests: ${RATE_LIMIT_API_REQUESTS:100}
      window-seconds: ${RATE_LIMIT_API_WINDOW_SECONDS:60}
    sensitive:
      requests: ${RATE_LIMIT_SENSITIVE_REQUESTS:30}
      window-seconds: ${RATE_LIMIT_SENSITIVE_WINDOW_SECONDS:60}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] [%X{requestId}] %-40.40logger{39} : %m%n"

