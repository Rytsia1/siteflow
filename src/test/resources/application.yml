spring:
  application:
    name: siteflow
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:siteflow}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&serverTimezone=UTC${DB_JDBC_PARAMS:}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 20000
  flyway:
    enabled: true
    user: ${FLYWAY_DB_USERNAME:${DB_USERNAME:root}}
    password: ${FLYWAY_DB_PASSWORD:${DB_PASSWORD:}}
    locations: classpath:db/migration,classpath:db/test-fixtures
    baseline-on-migrate: true
    validate-on-migrate: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

jwt:
  secret: ${JWT_SECRET:test-jwt-secret-key-32-chars-long-for-tests-only-xyz987}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cookie:
    name: ${JWT_COOKIE_NAME:siteflow_token}
    csrf-name: ${JWT_CSRF_COOKIE_NAME:XSRF-TOKEN}
    secure: ${JWT_COOKIE_SECURE:false}
    same-site: ${JWT_COOKIE_SAME_SITE:Lax}
    path: ${JWT_COOKIE_PATH:/}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] [%X{requestId}] %-40.40logger{39} : %m%n"
